worldnews.413.t:0 "[FROM.GetLeader]'s Dominance in the Chinese Situation"
worldnews.413.d:0 "Few things are certain in the twisting labyrinth of Chinese politics, but even renowned political analysts have utterly failed to predict the rise of [FROM.GetLeader] from one of the many provinces of China to the leader of the nation. Nevertheless, he has done it, and with Beijing and much of the North China Plain, under his rule, he has a base of operations, substantial enough, perhaps, to fully reunify all of China. Western nations have already recognized the new government of China, and any remaining Chinese cliques are undoubtedly preparing for a new assault on their power."
worldnews.413.a:0 "The rest of China will soon be ours!"
worldnews.413.b:0 "We must prepare for a renewed onslaught."
worldnews.413.c:0 "Congratulations, [FROM.GetLeaderName]!"







#annoying focuses for start menu btw total larp idk what im writing for descs
JAP_Grant_Patronage_to_Asanuma:0 "Maintain the Democratic Status Quo"
JAP_Grant_Patronage_to_Asanuma_desc:0 "Japan has secured the continuance of governance. As we continue our march of modernisation, remembering the old while building the new, we will reach closer and closer until we achieve our rightful place among the nations of the world."
JAP_Mobilize_for_the_Daitoa_Seisen:0 "Embrace Japanese Totalitarianism"
JAP_Mobilize_for_the_Daitoa_Seisen_desc:0 "The previous government has fallen. It has failed to act in the interests of the Japanese nation, paving the way for our victory with the support of the Japanese people. The remants of the failed course must be uprooted as we transform into a society that can break the  encirclement of powers that wish to destroy us."
JAP_Rising_Tides_and_Blooming_Petals:0 "Changing the Course of Japan's Proletariat"
JAP_Rising_Tides_and_Blooming_Petals_desc:0 "The cause of the proletariat has now become victorious. What had seemed impossible by its detractors has now been proven true. In the far east, a beacon of liberation now shines, blazing the path forward for the rest of the oppressed Asian peoples. Now is the time for rebuilding, as the light of world revolution now shines brighter." 


unite_china_justification_idea: "Our Dominant Position"
unite_china_justification_idea_desc: "Now that we are seen as the main power in Chinese politics, we must subjugate the remaining warlords."
form_republic_china_decision: "Succeeding the Republic of China"
form_republic_china_decision_desc: "Now that we control the capital, we can declare a new government representing China!"



