### National Spirits ###
TIA_isolated_city_state:0 "Isolated City State"
TIA_isolated_city_state_desc:0 "After our split from the collapsing legation cities, we have started to face isolation from majority from the international community, this will sure improve or worsen as time goes on."
TIA_japanese_inflence:0 "The Rising Sun Casts A Shadow From Above"
TIA_japanese_inflence_desc:0 "With gaining independence, Tianjin has become further under the eye of the Japanese Empire, with Japan having greater influence in the city in respect to the other concessions in the Legation Cities. With any attempt at breaking this influence maybe cause an aggressive reaction."
TIA_red_flag_over_tianjin:0 "The Red Flag Raised Over Tianjin"
TIA_red_flag_over_tianjin_desc:0 "As the Legation Cities shatters like a vase, the workers of Tianjin have seized their destinee and have liberated Tianjin from the corpose of the European imperialists. Though now we face threats from all sides, we raise our red flag up high."


