### Parties ###

TIA_totalist_party:0 "MZY" #this probably just becomes ccp either before game or right away i think?
TIA_totalist_party_long:0 "Makèsī Zhuyì Yánjiūhuì\n§LMarxism Research Society\nFormed in Beijing in 1920 by Li Dazhao and some of his students, the Marxist Research Association would become a centre for translating the works of Marx, Engels and Lenin into Chinese with the group being a part of the wider network that would form the Communist Party of China in 1921. But With the failure of the Russian Revolution and rise of syndicalism, the Communist Party of China would fracture as Chen Duxiu would support syndicalism. Then after this split, the CPC would enter an era of decline with the party being dissolved by 1927, as Li Dazhao would flee to Tianjin to escape the Qing and Fengtian forces. Now in exile the CPC no longer exists but the Marxist Research Association continues as a means to build up a new revolutionary force to which denounces syndicalism as revisionist. The Marxist Study Society seeks to unite Tianjin's (And overall China’s) workers, peasants and revolutionary students under the banner of proletarian revolution. Inspired by Marxism and the Russian Revolution, it advocates a centralized revolutionary party capable of overthrowing the old order and establishing working-class rule.§!"
TIA_syndicalist_party:0 "Tiānjīn Gōnghuì"
TIA_syndicalist_party_long:0 "Tiānjīn Shì Zong Gōnghuì\n§LTianjin Municipal Federation of Trade Unions\n Emerging from Tianjin's growing labour movement, the Federation traces its roots to the organizing efforts of the early 1920s, when An Xingsheng helped establish trade unions among the city's factory workers, railwaymen, dockworkers, and seamen. In August 1925, the Tianjin General Labour Union was founded, with An elected as its chairman. It coordinated strikes and anti-imperialist demonstrations, becoming a major centre of working-class resistance before being suppressed by the warlord authorities.§!"
TIA_radical_socialist_party:0 "Dàtóng Dang" # actually wait idk make this turn into generic communist party as well because its unifiying in???
TIA_radical_socialist_party_long:0 "Dàtóng Dang\n§LGreat Unity Party\nRooted in the revolutionary internationalism of its founders, the Datong Party advocates the liberation of oppressed peoples and the establishment of a society founded upon equality and common welfare. Drawing upon socialist thought and the ideal of Datong—a Great Unity transcending national and social divisions—the party seeks to unite China's revolutionaries with anti-imperialist movements across Asia. The Datong Party seeks to end imperial domination and establish a society founded upon equality among nations and peoples. It advocates international revolutionary cooperation, workers' rights, rural reform, and the expansion of cooperative and public ownership.§!"
TIA_social_democrat_party:0 "Sānmín Zhuyì Yánjiū"
TIA_social_democrat_party_long:0 "Sānmín Zhuyì Yánjiū Shè\n§LThree Principles of the People Study Society\nThe Three Principles of the People Study Society seeks to preserve Sun Yat-sen's revolutionary legacy amid the fragmentation of the Chinese Nationalist movement. Led by Li Xijiu, the Society upholds nationalism, democracy, and the people's livelihood, advocating national reunification, political reform, and social welfare while opposing foreign domination and the subordination of China's future to competing great powers. Rejecting both reactionary militarism and the abandonment of democratic principles, the Society seeks to unite reformist Nationalists, intellectuals, and anti-imperialist activists under a renewed interpretation of Tridemism.§!"
TIA_social_liberal_party:0 "Sānmín Zhuyì Yánjiū"
TIA_social_liberal_party_long:0 "Sānmín Zhuyì Yánjiū Shè\n§LThree Principles of the People Study Society\nThe Three Principles of the People Study Society seeks to preserve Sun Yat-sen's revolutionary legacy amid the fragmentation of the Chinese Nationalist movement. Led by Li Xijiu, the Society upholds nationalism, democracy, and the people's livelihood, advocating national reunification, political reform, and social welfare while opposing foreign domination and the subordination of China's future to competing great powers. Rejecting both reactionary militarism and the abandonment of democratic principles, the Society seeks to unite reformist Nationalists, intellectuals, and anti-imperialist activists under a renewed interpretation of Tridemism.§!"
TIA_market_liberal_party:0 "HJJW"
TIA_market_liberal_party_long:0 "Huáběi Jīngjì Jiùjì Wěiyuánhuì\n§LNorth China Economic Relief Committee\nEstablished in September 1935 under the leadership of Gao Lingwei and other North China political and commercial figures, the North China Economic Relief Committee presents itself as an organization dedicated to stabilizing the region's struggling economy and alleviating the hardships brought about by political turmoil. Through financial assistance, commercial cooperation, and the coordination of regional economic initiatives, it seeks to preserve North China's prosperity amid the growing uncertainty surrounding its future. Beneath its charitable and technocratic appearance, however, the Committee also serves as a vehicle for expanding Japanese economic influence in North China. Its cooperation with Japanese-backed economic organizations reflects Gao Lingwei's belief that regional stability can be secured through accommodation with Japan, even at the cost of greater foreign influence over China's economic affairs.§!"
TIA_social_conservative_party:0 "HJJW"
TIA_social_conservative_party_long:0 "Huáběi Jīngjì Jiùjì Wěiyuánhuì\n§LNorth China Economic Relief Committee\nEstablished in September 1935 under the leadership of Gao Lingwei and other North China political and commercial figures, the North China Economic Relief Committee presents itself as an organization dedicated to stabilizing the region's struggling economy and alleviating the hardships brought about by political turmoil. Through financial assistance, commercial cooperation, and the coordination of regional economic initiatives, it seeks to preserve North China's prosperity amid the growing uncertainty surrounding its future. Beneath its charitable and technocratic appearance, however, the Committee also serves as a vehicle for expanding Japanese economic influence in North China. Its cooperation with Japanese-backed economic organizations reflects Gao Lingwei's belief that regional stability can be secured through accommodation with Japan, even at the cost of greater foreign influence over China's economic affairs.§!"
TIA_authoritarian_democrat_party:0 "JFW"
TIA_authoritarian_democrat_party_long:0 "Jìdōng Fánggòng Wěiyuánhuì\n§LEast-Hebei Anti-Syndicalist Committee\nEmerging from the growing instability of North China, the East-Hebei Anti-Syndicalist Committee presents itself as a movement for regional autonomy, public order, and the suppression of communist agitation. Led by Yin Rugeng, it denounces the Qing government's inability to maintain stability and advocates a separate North China administration, promising to restore local government, develop regional resources, and protect commerce under the banner of anti-syndicalism.In practice, the Committee serves as an instrument for Japan's ambitions in North China. Backed by Japanese military and intelligence interests, it seeks to detach eastern Hebei from Peking’s authority and establish a regional order aligned with Tokyo. Its promises of autonomy conceal an increasingly dependent administration, whose survival rests upon Japanese support and cooperation with local officials, security forces, and commercial interests.§!"
TIA_paternal_autocrat_party:0 "JFW"
TIA_paternal_autocrat_party_long:0 "Jìdōng Fánggòng Wěiyuánhuì\n§LEast-Hebei Anti-Syndicalist Committee\nEmerging from the growing instability of North China, the East-Hebei Anti-Syndicalist Committee presents itself as a movement for regional autonomy, public order, and the suppression of communist agitation. Led by Yin Rugeng, it denounces the Qing government's inability to maintain stability and advocates a separate North China administration, promising to restore local government, develop regional resources, and protect commerce under the banner of anti-syndicalism.In practice, the Committee serves as an instrument for Japan's ambitions in North China. Backed by Japanese military and intelligence interests, it seeks to detach eastern Hebei from Peking’s authority and establish a regional order aligned with Tokyo. Its promises of autonomy conceal an increasingly dependent administration, whose survival rests upon Japanese support and cooperation with local officials, security forces, and commercial interests.§!"
TIA_national_populist_party:0 "Huángdàohuì"
TIA_national_populist_party_long:0 "Huángdào Huì\n§LYellow Way Society\Rooted in the rural secret societies of North China, the Huangdao Society draws its strength from peasant communities, local religious traditions, and armed self-defence associations. Promising protection from banditry, oppressive taxation, and the encroachment of distant authorities, it offers a sense of security and belonging to those abandoned by the established political order. Its millenarian beliefs and idealization of a righteous imperial past provide the movement with a vision of restoring moral order amid China's continuing turmoil. Under Chang Yuqing, the Society takes on a more centralized and politically ambitious character, seeking to transform its network of sworn followers and local associations into a force capable of reshaping North China's future. Distrustful of both revolutionary socialism and conventional republican government, it advocates a hierarchical order rooted in traditional morality, popular religious belief, and loyalty to its own leadership.§!"

