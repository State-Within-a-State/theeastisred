TIA_red_flag_over_tianjin_desc:0 "As the Legation Cities shatter like a vase, the workers of Tianjin have seized their destiny and have liberated Tianjin from the corpse of the European imperialists. Though now we face threats from all sides, we raise our red flag up high."


